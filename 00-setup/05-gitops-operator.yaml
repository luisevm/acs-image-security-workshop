# 05-gitops-operator.yaml
# Purpose: Install Red Hat OpenShift GitOps (Argo CD). Used in Step 3.
# Apply with envsubst: GITOPS_CHANNEL is resolved from the PackageManifest default channel.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-gitops-operator
  labels:
    app.kubernetes.io/part-of: acs-image-workshop
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: openshift-gitops-operator
  namespace: openshift-gitops-operator
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-gitops-operator
  namespace: openshift-gitops-operator
  labels:
    app.kubernetes.io/part-of: acs-image-workshop
spec:
  channel: ${GITOPS_CHANNEL}
  installPlanApproval: Automatic
  name: openshift-gitops-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
