# 01-acs-operator.yaml
# Purpose: Install the RHACS Operator from the Red Hat catalog.
# Apply with envsubst: ACS_CHANNEL is resolved from the PackageManifest default channel.
apiVersion: v1
kind: Namespace
metadata:
  name: rhacs-operator
  labels:
    app.kubernetes.io/part-of: acs-image-workshop
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhacs-operator
  namespace: rhacs-operator
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhacs-operator
  namespace: rhacs-operator
  labels:
    app.kubernetes.io/part-of: acs-image-workshop
spec:
  channel: ${ACS_CHANNEL}
  installPlanApproval: Automatic
  name: rhacs-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
