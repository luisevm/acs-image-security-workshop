# 02-placement.yaml
# Purpose: Select the clusters that must run ACS with image enforcement on.
# This single-cluster workshop selects only the hub itself (local-cluster).
# To cover a fleet, change the selector, for example to vendor=OpenShift.
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: acs-secured-clusters
  namespace: acs-policies
  labels:
    app.kubernetes.io/part-of: acs-image-workshop
spec:
  clusterSets:
    - global
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: local-cluster
              operator: In
              values: ["true"]
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: acs-secured-clusters
  namespace: acs-policies
  labels:
    app.kubernetes.io/part-of: acs-image-workshop
placementRef:
  apiGroup: cluster.open-cluster-management.io
  kind: Placement
  name: acs-secured-clusters
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: acs-image-enforcement-baseline
