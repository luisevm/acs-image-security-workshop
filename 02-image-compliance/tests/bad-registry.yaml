# bad-registry.yaml
# Purpose: Test workload that pulls from a registry outside the approved list.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-registry
  namespace: acs-image-demo
  labels:
    app: bad-registry
    app.kubernetes.io/part-of: acs-image-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-registry
  template:
    metadata:
      labels:
        app: bad-registry
        app.kubernetes.io/part-of: acs-image-workshop
    spec:
      containers:
        - name: app
          image: docker.io/library/busybox:1.36
          command: ["/bin/sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "true"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "true"]
            periodSeconds: 30
