# 04-current-app.yaml
# Purpose: Version 2.0.0 of the application, rebuilt on the current UBI 9 minimal
# image. The image tag comes from 02-imagestreams.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: current-app
  namespace: acs-image-demo
  labels:
    app: current-app
    app.kubernetes.io/part-of: acs-image-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: current-app
  template:
    metadata:
      labels:
        app: current-app
        app.kubernetes.io/part-of: acs-image-workshop
    spec:
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/acs-image-demo/current-app:2.0.0
          # Version tags can be moved to a new build; always check the registry
          imagePullPolicy: Always
          command: ["/bin/sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "true"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "true"]
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
