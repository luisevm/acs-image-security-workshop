# 01-argocd-rbac.yaml
# Purpose: Let the default Argo CD instance (openshift-gitops) manage SecurityPolicy
# custom resources in the stackrox namespace, and nothing else there.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-securitypolicy-manager
  namespace: stackrox
  labels:
    app.kubernetes.io/part-of: acs-image-workshop
rules:
  - apiGroups: ["config.stackrox.io"]
    resources: ["securitypolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-securitypolicy-manager
  namespace: stackrox
  labels:
    app.kubernetes.io/part-of: acs-image-workshop
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-securitypolicy-manager
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
