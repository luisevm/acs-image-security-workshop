# 02-application.yaml
# Purpose: Argo CD Application that keeps the SecurityPolicy CRs in stackrox in sync
# with the 03-policies-as-code/policies/ folder of your fork.
# Apply with envsubst: GIT_REPO_URL and GIT_REVISION come from myenv.sh.
# No resources finalizer: deleting the Application leaves the policies in place.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: acs-image-policies
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: acs-image-workshop
spec:
  project: default
  source:
    repoURL: ${GIT_REPO_URL}
    targetRevision: ${GIT_REVISION}
    path: 03-policies-as-code/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: stackrox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
