# 03-policy-image-age.yaml
# Purpose: Flags images built more than 3650 days ago. Old images usually miss a
# year or more of security errata.
# Mode: managed by Argo CD from Git (Step 3). Edit this file, commit, and push.
# Applied on the cluster where Central runs (namespace stackrox).
apiVersion: config.stackrox.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: workshop-image-age
  namespace: stackrox
  labels:
    workshop: acs-image-workshop
    app.kubernetes.io/part-of: acs-image-workshop
spec:
  policyName: "Workshop - Image older than 3650 days"
  description: "Image was created more than 3650 days ago."
  rationale: "Old base images accumulate unpatched vulnerabilities."
  remediation: "Rebuild the image on a current base image."
  categories:
    - DevOps Best Practices
  severity: LOW_SEVERITY
  lifecycleStages:
    - BUILD
    - DEPLOY
  eventSource: NOT_APPLICABLE
  enforcementActions:
    - FAIL_BUILD_ENFORCEMENT
    - FAIL_DEPLOYMENT_CREATE_ENFORCEMENT
    - FAIL_DEPLOYMENT_UPDATE_ENFORCEMENT
    - SCALE_TO_ZERO_ENFORCEMENT
  notifiers:
    - workshop-alert-sink
  scope:
    - namespace: acs-image-demo
  policySections:
    - sectionName: "Image age"
      policyGroups:
        - fieldName: Image Age
          booleanOperator: OR
          values:
            - value: "3650"
